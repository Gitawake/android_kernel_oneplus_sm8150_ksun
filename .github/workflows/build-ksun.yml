name: Build LOS 23.2 KernelSU Next
on:
  workflow_dispatch:
  push:
    branches: [los-23.2-ksun-v3.4.1]
concurrency:
  group: ksun-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Apply v3.4.1 compatibility patch
        run: |
          if test "$(git -C KernelSU-Next rev-parse --is-shallow-repository)" = true; then
            git -C KernelSU-Next fetch --unshallow --tags origin
          fi
          test "$(git -C KernelSU-Next describe --tags --exact-match HEAD)" = v3.4.1
          test "$(git -C KernelSU-Next rev-parse HEAD)" = 8f902aeb16033024143ae36cf711df902cf02fae
          git -C KernelSU-Next apply --check ../integration/ksun-v3.4.1-arm64-4.14.patch
          git -C KernelSU-Next apply ../integration/ksun-v3.4.1-arm64-4.14.patch
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi make bc bison flex libssl-dev libelf-dev python3 device-tree-compiler
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 vendor/sm8150-perf_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/oplus.config arch/arm64/configs/vendor/ksun.config
          make O=out ARCH=arm64 CC=clang olddefconfig
          grep -qx CONFIG_KSU=y out/.config
          grep -qx CONFIG_KPROBES=y out/.config
          grep -qx CONFIG_FTRACE_SYSCALLS=y out/.config
      - name: Compile KernelSU port first
        run: |
          set -o pipefail
          args=(O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 DTC_EXT=/usr/bin/dtc CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-)
          make -j"$(nproc)" "${args[@]}" prepare scripts
          make -j"$(nproc)" "${args[@]}" security/selinux/
          make -k -j"$(nproc)" "${args[@]}" drivers/kernelsu/ 2>&1 | tee ksun-build.log
      - name: Build kernel
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 DTC_EXT=/usr/bin/dtc CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tee build.log
      - name: Collect experimental build outputs
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image out/.config out/Module.symvers artifacts/
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cp --parents '{}' artifacts/ \;
          find out -name '*.ko' -exec cp --parents '{}' artifacts/ \;
          git rev-parse HEAD > artifacts/kernel-commit.txt
          git -C KernelSU-Next rev-parse HEAD > artifacts/ksun-commit.txt
          clang --version > artifacts/toolchain.txt
          echo 'EXPERIMENTAL: raw build outputs, not a flashable package. Device testing and matching WLAN modules are required.' > artifacts/STATUS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotdog-ksun-build
          include-hidden-files: true
          path: |
            artifacts/
            build.log
            ksun-build.log
            out/.config
          if-no-files-found: warn
