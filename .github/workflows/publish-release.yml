name: Publish successful kernel build
on:
  workflow_run:
    workflows: [Build LOS 23.2 KernelSU Next]
    types: [completed]
    branches: [los-23.2-ksun-v3.4.1]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build LOS 23.2 KernelSU Next run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.event.workflow_run.id || inputs.build_run_id }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
    steps:
      - name: Verify successful build source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '.conclusion == "success" and .head_branch == "los-23.2-ksun-v3.4.1" and .path == ".github/workflows/build-ksun.yml" and .head_repository.full_name == $repo' run.json
          echo "sha=$(jq -r .head_sha run.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@v4
        with:
          ref: fe57997ba9d16cda0632c559abd5753bc061ca81
          persist-credentials: false
          path: stock
      - name: Download build and verified stock materials
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" --name hotdog-ksun-build --dir build
          mkdir release
          gzip -d stock/boot-stock-los-23.2-20260925.img.gz stock/qca_cld3_wlan-stock.ko.gz
          echo '4368d800dcdd85f4601ca197508d6eff5fb50ca4cab36723da9336f79bf2a39c  stock/boot-stock-los-23.2-20260925.img' | sha256sum -c -
          echo '5bd975c3351c408e1ecec32928e4235feea0a737780b79fbf9411cc49d835036  stock/qca_cld3_wlan-stock.ko' | sha256sum -c -
          test "$(cat build/artifacts/kernel-commit.txt)" = "$(jq -r .head_sha run.json)"
          test "$(cat build/artifacts/ksun-commit.txt)" = 8f902aeb16033024143ae36cf711df902cf02fae
          test -s build/artifacts/Image
          grep -qx CONFIG_KSU=y build/artifacts/.config
      - name: Verify WLAN and repack boot
        shell: bash
        run: |
          set -euo pipefail
          python3 source/integration/check_module_abi.py stock/qca_cld3_wlan-stock.ko build/artifacts/Module.symvers > release/wlan-abi.json
          git init tools
          git -C tools remote add origin https://android.googlesource.com/platform/system/tools/mkbootimg
          git -C tools fetch --depth 1 origin d2bb0af5ba6d3198a3e99529c97eda1be0b5a093
          git -C tools checkout --detach FETCH_HEAD
          python3 source/integration/repack_los_boot.py --stock stock/boot-stock-los-23.2-20260925.img --kernel build/artifacts/Image --output release/boot-los-23.2-20260925-ksun-v3.4.1.img --tools tools > release/boot-repack-verification.json
          cp build/artifacts/.config release/kernel.config
          cp build/artifacts/Module.symvers release/Module.symvers
          cp build/artifacts/kernel-commit.txt build/artifacts/ksun-commit.txt build/artifacts/toolchain.txt release/
          tar -czf release/kernel-build.tar.gz -C build artifacts
          (cd release && sha256sum * > SHA256SUMS)
      - name: Publish unique prerelease
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.KSUN_RELEASE_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          build_attempt=$(jq -r .run_attempt run.json)
          tag="hotdog-los23.2-ksun-v3.4.1-${BUILD_RUN_ID}-${build_attempt}"
          sha=$(jq -r .head_sha run.json)
          # Create the exact source tag first. Release --target can require
          # workflows:write when the built commit predates workflow changes.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha > tag-sha.txt 2>/dev/null; then
            test "$(cat tag-sha.txt)" = "$sha"
          else
            test -n "$RELEASE_DEPLOY_KEY"
            release_key="$RUNNER_TEMP/ksun-release-key"
            known_hosts="$RUNNER_TEMP/ksun-release-known-hosts"
            (umask 077; printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$release_key")
            trap 'rm -f "$release_key"' EXIT
            gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$known_hosts"
            git -C source tag "$tag" "$sha"
            GIT_SSH_COMMAND="ssh -i $release_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts -o StrictHostKeyChecking=yes" git -C source push "git@github.com:$GH_REPO.git" "refs/tags/$tag"
            rm -f "$release_key"
          fi
          validation='This specific build has NOT been tested on a phone.'
          if test "$BUILD_RUN_ID" = 38128218220; then
            validation='This build was tested on hotdog / HD1911: temporary boots, permanent boot_b installation, normal reboots, Root, SELinux enforcing and stock WLAN passed. Longer-term stability remains unverified.'
          fi
          cat > notes.md <<EOF
          OnePlus 7T Pro / hotdog, LOS 23.2-20260925 only, KernelSU Next v3.4.1.

          Automatically published after a successful full kernel build, stock WLAN symbol CRC check, and boot repack verification. $validation It is an unsigned experimental boot, preserving the pinned stock ramdisk and DTB.

          Charging IRQ warnings also occur on stock LOS; memcg warnings have occurred in the port and remain under investigation. Long-term stability and Warp charging are unverified. Back up and temporarily boot before flashing; verify the actual slot. OTA updates require a matching rebuild and new stock boot materials.

          Download boot-los-23.2-20260925-ksun-v3.4.1.img for temporary boot testing. kernel-build.tar.gz contains raw outputs; Image is not a boot.img. Verify SHA256SUMS.

          Source: $sha
          Build: https://github.com/$GH_REPO/actions/runs/$BUILD_RUN_ID
          Tested reference build: https://github.com/$GH_REPO/actions/runs/38128218220
          Pinned stock materials: https://github.com/$GH_REPO/tree/fe57997ba9d16cda0632c559abd5753bc061ca81
          EOF
          if gh release view "$tag" --json isDraft --jq .isDraft > draft-state.txt 2>/dev/null; then
            if test "$(cat draft-state.txt)" = false; then
              echo "Published release already exists: $tag"
              exit 0
            fi
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --verify-tag --draft --prerelease --title "hotdog LOS 23.2 / KSU-N v3.4.1 / build $BUILD_RUN_ID.$build_attempt" --notes-file notes.md
          fi
          gh release edit "$tag" --draft=false
